name: hellohand_app
description: HelloHand - Traductor de señas en tiempo real
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP y WebSocket para APIs del servidor
  shared_preferences: ^2.2.2
  http: ^1.1.0
  http_io: ^1.0.0
  web_socket_channel: ^2.4.0
  
  # Cámara y permisos
  camera: ^0.10.5+5
  permission_handler: ^11.0.1
  
  # QR Scanner
  mobile_scanner: ^3.5.6
  qr_flutter: ^4.1.0
  
  # Estado y navegación
  provider: ^6.1.1
  go_router: ^12.1.1
  
  # UI
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/elements/
    - assets/images/elements/home_screen/